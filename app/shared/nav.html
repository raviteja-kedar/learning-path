<script>
  // Update the dashboard link based on the current page location
  document.addEventListener('DOMContentLoaded', function () {
    const dashboardLink = document.querySelector('.js-dashboard-link');
    const pathSegments = window.location.pathname.split('/');
    const depth =
      pathSegments.filter((segment) => segment.length > 0).length - 1;

    let path = '';
    if (depth > 0) {
      path = '../'.repeat(depth);
    }

    dashboardLink.href = path + 'dashboard.html';
  });
</script>
